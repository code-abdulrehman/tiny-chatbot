[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-model-download"
version = "0.1.0"
description = "Tiny local text chat with SmolLM2 and optional Kaggle BERT examples."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["kagglehub>=0.3,<1"]

[project.optional-dependencies]
inference = ["torch>=2.6", "transformers>=4.40,<5"]
chat = ["torch>=2.6", "transformers>=4.56,<5"]
web = ["torch>=2.6", "transformers>=4.56,<5", "streamlit>=1.66,<2"]
gateway = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[tool.setuptools]
py-modules = ["main", "use_model", "chat", "chat_engine", "chat_store", "message_actions", "message_time", "scroll_controls", "auto_reply", "server_port", "app"]
