[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-gateway"
version = "0.1.0"
description = "API gateway for organization hosted models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "asyncpg>=0.30"]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["gateway*"]
