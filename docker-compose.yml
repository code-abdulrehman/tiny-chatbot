services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8080
      - GATEWAY_DATABASE_URL=postgresql+asyncpg://gateway:gateway@db:5432/gateway
      - GATEWAY_STORE_BACKEND=postgres
      - GATEWAY_DEV_API_KEY=dev-key-change-me
      - GATEWAY_STRIPE_WEBHOOK_SECRET=whsec_change-me
      - GATEWAY_FREE_CREDITS=10000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
